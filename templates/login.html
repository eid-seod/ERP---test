<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ledgerly — Sign in</title><link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}"></head>
<body class="auth-shell"><main class="auth-card"><div class="brand-mark">L</div><p class="eyebrow">Ledgerly invoicing</p><h1>Welcome back</h1><p class="muted">Sign in to manage invoices, clients, and cash flow.</p><form id="login-form"><label>Email<input name="email" type="email" value="admin@example.com" required autocomplete="email"></label><label>Password<input name="password" type="password" value="Admin123!" required autocomplete="current-password"></label><button class="button primary full" type="submit">Sign in <span>→</span></button><p id="form-error" class="error"></p></form><div class="demo-hint">Demo admin: <strong>admin@example.com</strong> / <strong>Admin123!</strong></div></main><script src="{{ url_for('static', filename='js/app.js') }}"></script><script>document.getElementById('login-form').addEventListener('submit', login);</script></body></html>
