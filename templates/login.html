<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ personal_name }} — {{ solution_name }} sign in</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="auth-shell">
  <main class="auth-card">
    <div class="brand-mark" aria-hidden="true">ES</div>
    <p class="eyebrow">{{ solution_name }}</p>
    <h1>{{ personal_name }}</h1>
    <p class="muted">{{ solution_description }}</p>
    <p class="muted" style="margin-top:12px">A tool supporting my accounting, financial consulting, and business solutions services—not a standalone company.</p>
    <form id="login-form">
      <label>Email<input name="email" type="email" value="admin@example.com" required autocomplete="email"></label>
      <label>Password<input name="password" type="password" value="Admin123!" required autocomplete="current-password"></label>
      <button class="button primary full" type="submit">Open Accounting System <span aria-hidden="true">→</span></button>
      <p id="form-error" class="error" role="alert"></p>
    </form>
    <div class="demo-hint">Demo admin: <strong>admin@example.com</strong> / <strong>Admin123!</strong></div>
  </main>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script>document.getElementById('login-form').addEventListener('submit', login);</script>
</body>
</html>
