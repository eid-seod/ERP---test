<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ledgerly — New invoice</title><link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}"></head><body><div class="form-shell"><header class="topbar"><div><a href="/dashboard" class="back">← Back to dashboard</a><p class="eyebrow">Billing</p><h1>Create invoice</h1></div><button form="invoice-form" class="button primary">Save invoice</button></header><form id="invoice-form" class="invoice-layout"><section class="panel"><div class="panel-heading"><div><p class="eyebrow">01 / Details</p><h2>Invoice information</h2></div></div><div class="form-grid"><label>Client<select name="client_id" id="client_id" required><option value="">Select a client</option></select></label><label>Status<select name="status"><option value="draft">Draft</option><option value="sent">Sent</option><option value="paid">Paid</option></select></label><label>Issue date<input name="issue_date" type="date" required></label><label>Due date<input name="due_date" type="date"></label><label>Tax rate (%)<input name="tax_rate" type="number" min="0" max="100" step="0.01" value="0"></label></div></section><section class="panel"><div class="panel-heading"><div><p class="eyebrow">02 / Line items</p><h2>What are you billing for?</h2></div><button type="button" class="text-button" id="add-item">+ Add item</button></div><div id="items"></div><div class="totals"><span>Subtotal <strong id="subtotal">$0.00</strong></span><span>Tax <strong id="tax">$0.00</strong></span><span class="grand-total">Total <strong id="total">$0.00</strong></span></div></section><section class="panel"><label>Notes<textarea name="notes" rows="4" placeholder="Payment terms or a note for your client…"></textarea></label></section><p id="form-error" class="error"></p></form></div><script src="{{ url_for('static', filename='js/app.js') }}"></script><script>document.addEventListener('DOMContentLoaded', initInvoiceForm);</script></body></html>
