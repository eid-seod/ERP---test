# Include inside the one public Nginx server block.
# Do not add a URI to proxy_pass: existing accounting paths must remain unchanged.
location ~ ^/(login|logout|register|me|users|clients|invoices|invoice|dashboard|super-admin|companies)(/|$) {
    proxy_pass http://accounting_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
}
location ^~ /static/ {
    proxy_pass http://accounting_backend;
    proxy_set_header Host $host;
}
location / {
    proxy_pass http://portfolio_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
